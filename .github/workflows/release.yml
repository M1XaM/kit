name: Release

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v2.1.3
  workflow_dispatch: # Allows you to manually trigger a build from the GitHub UI

permissions:
  contents: write # Needed to create releases and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Frontend Dependencies
        run: |
          cd src/frontend
          npm install

      - name: Build Binaries
        run: |
          chmod +x src/build.sh
          ./src/build.sh

      - name: Package Linux
        run: |
          cd bin/linux
          tar -czvf ../kit-linux-amd64.tar.gz *

      - name: Package Windows
        run: |
          cd bin/windows
          zip -r ../kit-windows-amd64.zip *

      - name: Package macOS
        run: |
          cd bin/macos
          tar -czvf ../kit-macos-arm64.tar.gz *

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            bin/kit-linux-amd64.tar.gz
            bin/kit-windows-amd64.zip
            bin/kit-macos-arm64.tar.gz
